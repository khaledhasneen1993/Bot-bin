name: Backtest 20 pairs 10x Sep26-Oct25
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-20pairs-10x-20260926-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: botbin-historical-20pairs-10x-sep26-oct25
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      INITIAL_CAPITAL: '100'
      USE_TESTNET: 'false'
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new historical replay without modifying strategy
        run: python -m py_compile backtests/replay_20pairs_10x_20260926_20261025.py
      - name: Execute 30-day 20-symbol 10x backtest on real Binance futures archive
        run: python backtests/replay_20pairs_10x_20260926_20261025.py
      - name: Persist measured results or exact failure details to git
        if: always()
        shell: bash
        run: |
          mkdir -p backtests/results/20pairs-10x-20260926-20261025
          if [ ! -f backtests/results/20pairs-10x-20260926-20261025/summary.json ]; then
            printf '{"status":"failed","error":"Run ended before writing summary; inspect GitHub Actions job logs"}\n' > backtests/results/20pairs-10x-20260926-20261025/summary.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/results/20pairs-10x-20260926-20261025
          git commit -m "Record actual 20-pair 10x historical results or failure" || true
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "WARN: unable to push report; upload artifact retains evidence"
      - name: Upload run evidence, report, and trade list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botbin-20pairs-10x-historical-results
          path: backtests/results/20pairs-10x-20260926-20261025
          retention-days: 30
          if-no-files-found: warn
